[project]
name = "econ-api-bridge"
version = "0.2.0"
description = "econ-api-bridge es un conjunto de funciones diseñadas para facilitar la conexión con distintas APIs y obtener información económica, estadística y financiera de diversas fuentes. Este proyecto permite automatizar la extracción de datos y estructurarlos de manera eficiente para su análisis y uso en distintos entornos."
authors = [
    {name = "SpiderCoop", email = "david.jimenez.cooper@gmail.com"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
extend-ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Ignorar el uso de 'assert' (S101) y el uso de contraseñas de prueba (S105, S106, S107)
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]