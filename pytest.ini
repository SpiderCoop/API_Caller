[pytest]
# Pytest configuration for Econ API Bridge

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require API access
    parametrize_api: Parametrized tests for different APIs

# Test output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (if pytest-cov is installed)
# addopts = --cov=econ_api_bridge --cov-report=html --cov-report=term-missing

# Ignore deprecation warnings in dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test paths
testpaths = tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/.pytest.log
log_file_level = DEBUG
